apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: retrievalops-weighted
spec:
  weighted:
    services:
      - name: retrievalops-stable
        port: 80
      - name: retrievalops-canary
        port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: retrievalops
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`retrievalops.example.com`)
      middlewares:
        - name: retrievalops-rate-limit
        - name: retrievalops-inflight
      services:
        - kind: TraefikService
          name: retrievalops-weighted
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retrievalops-rate-limit
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 30
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retrievalops-inflight
spec:
  inFlightReq:
    amount: 32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retrievalops-https-only
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: retrievalops-http
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`retrievalops.example.com`)
      middlewares:
        - name: retrievalops-https-only
      services:
        - kind: TraefikService
          name: retrievalops-weighted
