apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retrievalops-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retrievalops-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: retrievalops
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 5000
