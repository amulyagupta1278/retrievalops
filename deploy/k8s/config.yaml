apiVersion: v1
kind: ConfigMap
metadata:
  name: retrievalops
data:
  RETRIEVALOPS_ALLOWED_ORIGINS: '["https://retrievalops.example.com"]'
  RETRIEVALOPS_SERVICE_NAME: retrievalops
  RETRIEVALOPS_STORAGE_ROOT: /data/artifacts
  RETRIEVALOPS_MLFLOW_ARTIFACT_ROOT: /data/mlflow-artifacts
  RETRIEVALOPS_MAX_UPLOAD_BYTES: "10485760"
  RETRIEVALOPS_MAX_PDF_PAGES: "200"
  RETRIEVALOPS_SANDBOX_TTL_HOURS: "23"
  RETRIEVALOPS_SANDBOX_REQUESTS_PER_MINUTE: "120"
  RETRIEVALOPS_EXTRACTION_TIMEOUT_SECONDS: "30"
