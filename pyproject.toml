[project]
name = "retrievalops"
version = "0.1.0"
description = "Evidence-driven retrieval policy release control"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faiss-cpu>=1.12,<2",
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "sentence-transformers>=5.1,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
retrievalops-api = "retrievalops.cli:main"
retrievalops-api-smoke = "retrievalops.smoke:main"
retrievalops-worker = "retrievalops.worker:main"
retrievalops-validate-fixtures = "retrievalops.fixture_cli:main"
retrievalops-benchmark-fixtures = "retrievalops.controlled_cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrievalops"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["work"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["retrievalops"]
