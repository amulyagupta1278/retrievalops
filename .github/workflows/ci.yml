name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RETRIEVALOPS_TEST_POSTGRES_URI: postgresql+psycopg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python 3.12 --no-managed-python
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run retrievalops-validate-fixtures
      - run: uv run retrievalops-benchmark-fixtures --output "${RUNNER_TEMP}/controlled-benchmarks"
      - name: Audit locked environment
        run: uvx --from pip-audit==2.10.1 pip-audit --path .venv/lib/python3.12/site-packages --skip-editable
      - name: Validate Prometheus rules
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz \
            --output "${RUNNER_TEMP}/prometheus.tar.gz"
          echo "f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d  ${RUNNER_TEMP}/prometheus.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/prometheus.tar.gz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/prometheus-3.14.0.linux-amd64/promtool" check rules deploy/observability/alerts.yml

  container:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          load: true
          tags: retrievalops:test
          build-args: BUILD_SHA=${{ github.sha }}
      - run: docker run --detach --name retrievalops -p 8000:8000 retrievalops:test
      - run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs retrievalops
          exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retrievalops:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
          provenance: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PUBLIC_HOSTNAME != ''
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.33.3
      - name: Install pinned Argo Rollouts CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.10.0/kubectl-argo-rollouts-linux-amd64 \
            --output "${RUNNER_TEMP}/kubectl-argo-rollouts"
          echo "57a464e80c3e716076c9760e1d15ff06b853e3bcab3e22e30f4dba8a3e9f29b2  ${RUNNER_TEMP}/kubectl-argo-rollouts" | sha256sum --check
          chmod 0755 "${RUNNER_TEMP}/kubectl-argo-rollouts"
      - name: Configure production cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "${KUBE_CONFIG_DATA}"
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > "${RUNNER_TEMP}/kubeconfig"
          chmod 0600 "${RUNNER_TEMP}/kubeconfig"
      - name: Apply immutable release and await automated analysis
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          echo "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "${PUBLIC_HOSTNAME}" | grep -Eq '^[a-z0-9][a-z0-9.-]+[a-z0-9]$'
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl -n retrievalops get secret retrievalops-runtime
          kubectl kustomize deploy/k8s \
            | sed "s#ghcr.io/amulyagupta1278/retrievalops@sha256:0\{64\}#${IMAGE}@${DIGEST}#; s#retrievalops.example.com#${PUBLIC_HOSTNAME}#" \
            | kubectl apply -f -
          "${RUNNER_TEMP}/kubectl-argo-rollouts" status retrievalops -n retrievalops --timeout 15m
      - name: Update worker only after API promotion
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          sed "s#ghcr.io/amulyagupta1278/retrievalops@sha256:0\{64\}#${IMAGE}@${DIGEST}#" deploy/k8s/worker.yaml \
            | kubectl apply -f -
          if ! kubectl -n retrievalops rollout status deployment/retrievalops-worker --timeout=10m; then
            kubectl -n retrievalops rollout undo deployment/retrievalops-worker
            kubectl -n retrievalops rollout status deployment/retrievalops-worker --timeout=5m
            exit 1
          fi
          sed "s#ghcr.io/amulyagupta1278/retrievalops@sha256:0\{64\}#${IMAGE}@${DIGEST}#" deploy/k8s/cleanup.yaml \
            | kubectl apply -f -
